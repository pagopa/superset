name: Setup Superset
description: It will setup the current personalization inside Superset

outputs:
  working-directory:
    description: 'The working directory where Superset is setup'
    value: ${{ steps.install.outputs.WORKING_DIRECTORY }}
  superset-version:
    description: 'The version of Superset that is setup'
    value: ${{ steps.install.outputs.SUPERSET_VERSION }}

runs:
  using: composite
  steps:
    - name: install
      id: install
      shell: bash
      run: |
        bash "$GITHUB_WORKSPACE/scripts/prepare-superset-source.sh"
        echo "SUPERSET_VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/SUPERSET_VERSION")" >> "$GITHUB_OUTPUT"
        echo "WORKING_DIRECTORY=$GITHUB_WORKSPACE/.superset-build" >> "$GITHUB_OUTPUT"
