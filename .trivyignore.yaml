secrets:
  # False positive: these files contain an example GCP service-account JSON
  # config (e.g. "private_key": "...") used to document the expected
  # credentials_info shape for the BigQuery/Datastore connectors, not a real
  # secret.
  - id: gcp-service-account
    paths:
      - "**/db_engine_specs/bigquery.py"
      - "**/db_engine_specs/datastore.py"

vulnerabilities:
  # wheel and jaraco.context are not standalone installed packages in this
  # image: both only appear as copies vendored inside setuptools/_vendor/
  # (setuptools' own bundled build tooling), never imported or executed by
  # Superset at runtime. Upgrading the top-level wheel/jaraco.context
  # packages does not touch these vendored copies, so there is no
  # actionable pip-level fix here.
  - id: CVE-2026-24049 # wheel, vendored inside setuptools/_vendor
  - id: CVE-2026-23949 # jaraco.context, vendored inside setuptools/_vendor
